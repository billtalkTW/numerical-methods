 ['初值與失敗訊號','<p>導數接近零，可能讓牛頓更新步伐很大；割線兩點函數值接近時，分母也會失去穩定性。先畫圖、縮小區間，再使用快速方法，通常較容易控制。</p><p>圖中的「指定參考根」會清楚列出。收斂到其他根時，殘差可能很小，但與這個參考根的距離仍不小。</p>']
 ]},
 {id:'interpolation',label:'內插與節點',en:'INTERPOLATION',title:'資料點如何決定一條多項式',intro:'切換等距與 Chebyshev 節點，改變多項式次數，直接觀察曲線與節點間的誤差。',idea:'內插多項式要通過所有給定資料點。節點位置和次數會影響區間內的行為，增加點數不一定讓整條曲線更準。',equation:'P(x)=Σ<sub>i</sub> yᵢ ∏<sub>j≠i</sub> (x−xⱼ)/(xᵢ−xⱼ)',source:'Poly interpolation 講義 Note #5；0930week4.xlsm。Chebyshev 節點為補充比較。',cards:[
 ['存在與唯一性','<p>m 個相異 x 節點，決定唯一的至多 m−1 次內插多項式。這個次數限制不可省略；任意更高次多項式並不唯一。</p><p>先用每個原節點回代，確認 P(xᵢ)=yᵢ，再使用模型做微分或積分。</p>'],
 ['Lagrange 和 Newton','<p>Lagrange 直接疊加各節點的基底多項式；Newton 則透過差商逐階建立。對同一組相異節點，理論上是相同多項式的不同表示。</p><p>本互動使用等價的重心形式求值，讓改變節點數時仍能穩定繪製；它沒有改變內插模型。</p>'],
 ['Runge 現象與節點選擇','<p>對 1/(1+25x²)，高次等距內插可能在端點附近產生明顯振盪。這反映節點與全域多項式模型的限制。</p><p>Chebyshev 節點在端點較密集，常能減輕這種振盪。它是節點設計的比較，不是所有函數都必然改善的保證。</p>'],
 ['模型誤差與計算誤差','<p>節點處完全吻合，不代表節點之間也吻合。若對內插曲線積分，精確算出的是模型 P 的面積；原函數仍可能有模型誤差。</p><p>畫面列出的最大誤差來自有限取樣網格，不是經過數學證明的連續區間誤差上界。超出資料區間的查詢則屬於外插。</p>']
 ]},
 {id:'differentiation',label:'微分與誤差',en:'FINITE DIFFERENCES',title:'步長縮小，誤差為什麼會轉彎',intro:'選函數、觀察位置與差分公式，調整 h。右圖直接以目前瀏覽器的浮點計算，比較步長與誤差。',idea:'差分用附近點的函數值近似導數。小 h 能減少截斷誤差，卻也可能放大相近數相減造成的捨入誤差。',equation:'中央差分：D(h)=[f(x+h)−f(x−h)]/(2h)',source:'Derivatives 講義 Note #9；Taylor 講義；1014week5.xlsm。',cards:[
 ['從割線到切線','<p>前向差分取 x 與 x+h；中央差分取 x−h 與 x+h。兩側對稱能消掉 Taylor 展開的部分誤差項。</p><div class="math">前向 O(h)；中央 O(h²)<br>五點中央 O(h⁴)</div><p>此處的階數描述足夠平滑且 h 適當時的截斷誤差。</p>'],
 ['Richardson 消去主誤差','<p>若 D(h)=f′(x)+Ch²+O(h⁴)，把 h 減半後的結果乘以 4，再減去 D(h)，就能消去 Ch²。</p><div class="math">Dᴿ=[4D(h/2)−D(h)]/3</div><p>當捨入誤差主導時，外推不會自動恢復正確導數。</p>'],
 ['圖上的誤差是怎麼來的？','<p>這些函數的解析導數已知，所以可直接比較 |數值導數−解析導數|。右圖的橫軸與縱軸都是 log₁₀，顯示的是實際運算結果。</p><p>不同函數、位置與電腦精度會有不同的最佳步長。圖形不一定是平滑的標準 U 形。</p>'],
 ['定義域與端點','<p>差分公式需要所有指定取樣點都有定義。五點中央公式需要 x±h 與 x±2h，範圍比三點中央更大。</p><p>若取樣點越過對數等函數的定義域，應改公式或位置；不能把無法求值的點設成零。</p>']
 ]},
 {id:'integration',label:'積分與外推',en:'NUMERICAL QUADRATURE',title:'從面積近似，到誤差消去',intro:'切換函數與積分方法，改變上下限、分段數，觀察近似圖形與收斂速度。',idea:'用有限個取樣值和權重近似積分。增加分段、提高局部多項式階數與使用外推，是不同的改善方式。',equation:'梯形：Tₙ=h[f(a)/2+Σ f(a+ih)+f(b)/2]',source:'Integration 講義 Note #10；1021week6.xlsm。',cards:[
 ['直線與拋物線','<p>梯形法在每段用直線取代曲線；Simpson 1/3 每兩小段用一條拋物線。因此 Simpson 的總小區間數 n 必須是偶數。</p><p>平滑函數下，複合梯形的整體誤差為 O(h²)，Simpson 1/3 為 O(h⁴)。階數不代表每一個粗網格都立即符合誤差倍率。</p>'],
 ['Gauss 的節點與倍率','<p>q 點 Gauss-Legendre 在標準 [-1,1] 同時選擇節點與權重，能對至多 2q−1 次多項式精確積分。</p><div class="math">x=m+rt，m=(a+b)/2，r=(b−a)/2<br>I≈r Σ wᵢf(m+rtᵢ)</div><p>這裡 n 是小區間數，q 是每段節點數。兩者不可混用。</p>'],
 ['Romberg 的表格','<p>以梯形為第一欄，每列 n 加倍，再消去 h²、h⁴、h⁶ 的主誤差。第 j 欄的倍率為 4ʲ，分母是 4ʲ−1。</p><div class="math">Rₖ,ⱼ=(4ʲRₖ,ⱼ₋₁−Rₖ₋₁,ⱼ₋₁)/(4ʲ−1)</div><p>需要平滑性與適當誤差展開。不能任意把 Gauss 結果塞入同一套梯形外推。</p>'],
 ['有號積分與精確度','<p>函數在 x 軸下方的部分對積分給負貢獻，因此有號積分不等於幾何總面積。若正負抵消使參考積分為零，相對誤差就不適用。</p><p>本節使用解析原函數給出參考值。近似圖形只是幾何輔助；顯示位數與網格密度本身不能當作精確度證明。</p>']
 ]},
 {id:'double',label:'雙重積分與 3D',en:'SURFACE & DOUBLE INTEGRALS',title:'區域、曲面與小體積的加總',intro:'選曲面與積分區域，拖曳旋轉 3D 圖。顯示中點長方柱後，分段數會同時改變小體積的形狀與計算誤差。',idea:'雙重積分把區域上方的函數高度加總。每一小塊以高度乘底面積近似，再讓切分逐步變細。',equation:'I≈ΣᵢΣⱼ f(xᵢ*,yⱼ*) Δx Δyᵢ',source:'Double integral 講義；1028week7.xlsm。3D 投影與曲面比較為補充教學。',cards:[
 ['先決定底部的區域','<p>二重積分的上下限描述 xy 平面的區域。3D 曲面 z=f(x,y) 則描述該區域上方的高度；區域和 integrand 是兩件事。</p><p>這裡提供正方形、三角形與拋物線邊界。右側 2D 圖顯示固定 x 時，內層 y 從哪裡走到哪裡。</p>'],
 ['長方柱如何對應公式','<p>每個外層小區間取中點 xᵢ*，再依目前 xᵢ* 的上下界切分 y。每根柱子的高度是 f(xᵢ*,yⱼ*)，體積為高度×Δx×Δyᵢ。</p><p>對曲邊區域，底面也由中點小矩形近似。因此邊緣會呈現階梯形；分段加密後，這些小矩形更接近原區域。</p>'],
 ['兩層步長要一起看','<p>內層上限若是 x 或 x²，Δyᵢ 會隨外層 x 改變。不能只算一次內層積分後重複使用，也不能只加密外層就忽略內層誤差。</p><p>畫面中 n 同時控制兩個方向，每層 n 個小區間。右圖可觀察同步加密後的誤差下降。</p>'],
 ['旋轉、縮放與參考值','<p>拖曳或使用視角滑桿只改變觀看方向，不影響積分數值。高度軸會依函數範圍縮放，刻度仍標示原函數高度。</p><p>多項式曲面及正方形上的波面使用解析參考；曲邊波面使用高密度四點 Gauss 交叉核算，標示為「高密度參考差」，不冒充嚴格真誤差。</p>']
 ]},
 {id:'improper',label:'瑕積分與代換',en:'IMPROPER INTEGRALS',title:'先處理端點，再談數值精確度',intro:'比較原函數與代換後的函數，並把截斷誤差與離散誤差分開觀察。奇異點的高度無限大，不等於面積一定無限大。',idea:'無窮區間、端點無限大或區間內奇異點，需要先改寫或拆段。代換同時改變函數、微分因子與上下限。',equation:'x=t/(1−t)，dx=dt/(1−t)²',source:'課綱瑕積分單元；1028week7.xlsm；歷屆積分題型的概念整理。',cards:[
 ['截斷留下兩種誤差','<p>把 ∫₀∞ 改成 ∫₀ᴮ 會留下尾端面積。即使有限區間積分算得很準，仍有截斷誤差。</p><p>固定 n 時，增加 B 也會增大步長；因此不能只把上限改成非常大的數，就認為答案一定準確。</p>'],
 ['變數代換的三件事','<p>由 x=t/(1−t) 將 [0,∞) 壓到 [0,1)。把 integrand 與 dx/dt 相乘，再計算新端點的極限。</p><p>原式代入端點出現 0/0，可能只是尚未化簡。若代換後極限有限，就能用延拓後的端點值。</p>'],
 ['可積奇異點與發散','<p>對 ∫₀¹x⁻ᵅ dx，0<α<1 時積分為 1/(1−α)；α≥1 時發散。增加分段數不能把發散的積分變成收斂。</p><div class="math">x=u<sup>1/(1−α)</sup> ⇒ x<sup>−α</sup>dx=du/(1−α)</div><p>這個平滑化到 [0,1] 的推導，限於 α<1。</p>'],
 ['不要刪掉不方便的節點','<p>把無限大的端點改成零，或只跳過一個取樣點，並沒有控制附近的面積。若奇異點在區間內，應先拆成左右兩個瑕積分，各自確認收斂。</p><p>本節的圖將尖峰超出圖框的部分裁切；裁切只是繪圖，不是把積分的那一段刪掉。</p>']
 ]}
];
</script><script>'use strict';
(()=>{
 const M=MathLab,P=LabPlots,$=id=>document.getElementById(id),fmt=P.fmt,esc=P.esc;
 const initial={
  taylor:{fid:'exp',k:1,a:-1,b:1,x0:0,m:4,q:.5,wide:false},
  roots:{rid:'cubic',c:2,method:'newton',a:1.5,b:2,step:0},
  interpolation:{fid:'runge',k:25,a:-1,b:1,degree:8,kind:'uniform',q:.35,wide:true},
  differentiation:{fid:'sin',k:1,a:0,b:2,x0:1,hpow:-2,method:'central'},
  integration:{fid:'runge',k:1,a:0,b:1,method:'trap',npow:3},
  double:{sid:'wave',k:1.5,region:'rectangle',n:6,slice:.5,yaw:-38,pitch:32,zoom:1,columns:true},
  improper:{iid:'rational',alpha:.5,npow:4,B:6,epspow:-3}
 };
 const states=JSON.parse(JSON.stringify(initial));let active='taylor',surfaceCache=null,frame=0;
 const controls={
  select:(key,title,options,value)=>`<label>${title}<select data-key="${key}">${options.map(([v,t])=>`<option value="${v}" ${v===value?'selected':''}>${t}</option>`).join('')}</select></label>`,
  range:(key,title,value,min,max,step=1)=>`<label>${title}<output data-output="${key}"></output><input data-key="${key}" type="range" value="${value}" min="${min}" max="${max}" step="${step}"></label>`,
  number:(key,title,value,min=-5,max=5,step=.1)=>`<label>${title}<input data-key="${key}" type="number" value="${value}" min="${min}" max="${max}" step="${step}"></label>`,
  check:(key,title,value)=>`<label class="check-label"><input data-key="${key}" type="checkbox" ${value?'checked':''}>${title}</label>`
 };
 const legend=(entries)=>`<div class="legend">${entries.map(([text,color,dash])=>`<span class="${dash?'dash':''}" style="--swatch:var(--${color||'blue'})">${text}</span>`).join('')}</div>`;
 const panel=(title,id,desc='',entries=[])=>`<section class="plot-panel"><h2>${title}</h2>${desc?`<p class="subtle">${desc}</p>`:''}${legend(entries)}<div class="plot" id="${id}"></div><p class="caption" id="${id}-caption"></p></section>`;
 function metricHTML(items){return `<div class="metric-row ${items.length===4?'four':''}">${items.map(([label,value,note])=>`<div class="metric"><span>${label}</span><strong>${typeof value==='number'?fmt(value,10):value}</strong>${note?`<small>${note}</small>`:''}</div>`).join('')}</div>`;}
 function metrics(items){$('metrics').innerHTML=metricHTML(items);}
 function baseFunctionControls(s,limits=true){const info=M.functionInfo.find(f=>f.id===s.fid),prefix=active==='integration'?'積分':active==='interpolation'?'資料':'繪圖';return controls.select('fid','函數',M.functionInfo.map(f=>[f.id,f.name]),s.fid)+controls.range('k','函數參數 k',s.k,info.min,info.max,info.step)+(limits?controls.number('a',prefix+'下限 a',s.a)+controls.number('b',prefix+'上限 b',s.b):'');}
 function buildControls(){const s=states[active];let h='';
  if(active==='taylor')h=baseFunctionControls(s)+controls.range('x0','展開點 x₀',s.x0,s.a,s.b,.02)+controls.range('m','多項式階數 m',s.m,0,14)+controls.range('q','觀察位置 x',s.q,s.a,s.b,.02)+controls.check('wide','縱軸納入近似值',s.wide);
  else if(active==='interpolation')h=baseFunctionControls(s)+controls.select('kind','節點分布',[['uniform','等距節點'],['chebyshev','Chebyshev 節點']],s.kind)+controls.range('degree','多項式次數',s.degree,1,18)+controls.range('q','觀察位置 x',s.q,s.a-.2*(s.b-s.a),s.b+.2*(s.b-s.a),.02)+controls.check('wide','縱軸納入內插曲線',s.wide);
  else if(active==='differentiation')h=baseFunctionControls(s,false)+controls.number('x0','微分位置 x',s.x0)+controls.select('method','差分公式',[['forward','前向 O(h)'],['central','中央 O(h²)'],['five','五點中央 O(h⁴)'],['richardson','Richardson 外推']],s.method)+controls.range('hpow','步長 h',s.hpow,-12,-.2,.1);
  else if(active==='integration')h=baseFunctionControls(s)+controls.select('method','積分方法',[['trap','複合梯形'],['simpson','Simpson 1/3'],['gauss3','三點 Gauss'],['romberg','Romberg 外推']],s.method)+controls.range('npow','分段數 n',s.npow,1,7)+`<p class="control-note">這裡 n 是小區間數。參考積分由所選函數的解析原函數計算；正負面積會相互抵消。</p>`;
  else if(active==='roots'){
   const info=M.rootInfo.find(f=>f.id===s.rid);h=controls.select('rid','零點方程 f(x)=0',M.rootInfo.map(f=>[f.id,f.name+'=0']),s.rid)+controls.range('c','函數參數 c',s.c,info.min,info.max,.1)+controls.select('method','求根方法',[['newton','牛頓法'],['bisection','二分法'],['secant','割線法']],s.method)+controls.number('a',s.method==='bisection'?'區間下限 a':'初始位置 x₀',s.a)+ (s.method==='newton'?'':controls.number('b',s.method==='bisection'?'區間上限 b':'初始第二點 x₁',s.b))+controls.range('step','顯示到第 k 步',s.step,0,14)+`<div class="control-actions"><button type="button" id="prev-step">上一步</button><button type="button" id="next-step" class="primary">下一步</button></div>`;
  }else if(active==='double')h=controls.select('sid','曲面 z=f(x,y)',M.surfaceInfo.map(f=>[f.id,f.name]),s.sid)+controls.select('region','xy 平面積分區域',[['rectangle','正方形：0≤y≤1'],['triangle','三角形：0≤y≤x'],['parabola','拋物線：0≤y≤x²']],s.region)+controls.range('k','波面參數 k',s.k,.5,4,.1)+controls.range('n','每層分段 n',s.n,2,24)+controls.range('slice','固定外層 x',s.slice,0,1,.01)+controls.range('yaw','左右視角',s.yaw,-180,180)+controls.range('pitch','俯視角度',s.pitch,15,75)+controls.check('columns','顯示中點長方柱',s.columns)+`<p class="control-note">區域的外層均為 0≤x≤1。滑鼠或觸控拖曳 3D 圖可旋轉；視角不影響積分。k 只影響波面函數。</p>`;
  else h=controls.select('iid','原始瑕積分',M.improperInfo.map(f=>[f.id,f.name]),s.iid)+controls.range('npow','每段取樣分段 n',s.npow,1,7)+(s.iid==='singular'?controls.range('alpha','奇異指數 α',s.alpha,.1,1.3,.05)+controls.range('epspow','截去端點長度 ε',s.epspow,-8,-1,.1):controls.range('B','直接截斷上限 B',s.B,1,30,.5));
  $('controls').innerHTML=h;
  $('controls').querySelectorAll('[data-key]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{
   const key=el.dataset.key;s[key]=el.type==='checkbox'?el.checked:el.tagName==='SELECT'?el.value:Number(el.value);
   if(key==='fid'){const i=M.functionInfo.find(f=>f.id===s.fid);Object.assign(s,{k:i.k,a:i.a,b:i.b});if('x0'in s)s.x0=i.x0;if('q'in s)s.q=active==='interpolation'?i.a+.675*(i.b-i.a):Math.min(i.b,i.x0+.25*(i.b-i.a));buildControls();}
   else if(key==='rid'){const i=M.rootInfo.find(f=>f.id===s.rid);Object.assign(s,{c:i.c,a:s.method==='newton'?i.x0:i.a,b:i.b,step:0});buildControls();}
   else if(active==='roots'&&key==='method'){const i=M.rootInfo.find(f=>f.id===s.rid);Object.assign(s,{a:s.method==='newton'?i.x0:i.a,b:i.b,step:0});buildControls();}
   else if(key==='iid')buildControls();
   else if(['a','b'].includes(key)&&active!=='roots'&&s.a<s.b){if('x0'in s){s.x0=Math.max(s.a,Math.min(s.b,s.x0));const x=$('controls').querySelector('[data-key="x0"]');if(x){x.min=s.a;x.max=s.b;x.value=s.x0;}}if('q'in s){const ext=active==='interpolation'?.2*(s.b-s.a):0;s.q=Math.max(s.a-ext,Math.min(s.b+ext,s.q));const x=$('controls').querySelector('[data-key="q"]');x.min=s.a-ext;x.max=s.b+ext;x.value=s.q;}}
   if(active==='double'&&['yaw','pitch'].includes(key)){updateOutputs();drawSurface();}else draw();
  }));
  $('prev-step')?.addEventListener('click',()=>{s.step=Math.max(0,s.step-1);$('controls').querySelector('[data-key="step"]').value=s.step;draw();});
  $('next-step')?.addEventListener('click',()=>{s.step=Math.min(14,s.step+1);$('controls').querySelector('[data-key="step"]').value=s.step;draw();});

  else{fills.push({points:[[s.a,0],...P.sample(f,s.a,s.b),[s.b,0]],color:'teal'});for(let i=0;i<n;i++)for(const z of M.gn[3][0]){const x=s.a+(i+.5)*h+h*z/2;points.push({x,y:f(x),radius:n>16?1.8:3});}}
  P.svg($('plot1'),{x:[s.a,s.b],y:P.range(P.sample(f,s.a,s.b).map(v=>v[1])),label:'所選積分公式與原函數的幾何近似',curves,segments,points,fills});
  const epoints=Array.from({length:7},(_,i)=>[i+1,logerr(integralResult(model,s,2**(i+1))-reference)]);P.svg($('plot2'),{x:[1,7],y:P.range(epoints.map(p=>p[1]),false),xt:[1,2,3,4,5,6,7],label:'分段數加倍後，與解析積分值的絕對誤差',curves:[{points:epoints,color:'teal'}],points:[{x:s.npow,y:epoints[s.npow-1][1],label:`n=${n}`}],xlabel:'log₂(n)',ylabel:'log₁₀ |誤差|'});
  metrics([['數值積分',result],['解析參考',reference],['絕對誤差',Math.abs(result-reference)],['相對誤差',reference===0?'不適用':fmt(Math.abs((result-reference)/reference),10),reference===0?'參考值為零':'分母為 |參考值|']]);
  $('romberg-panel').hidden=s.method!=='romberg';if(s.method==='romberg'){const rows=M.romberg(f,s.a,s.b,s.npow);$('trace').innerHTML=`<table><thead><tr><th>n</th>${rows.at(-1).map((_,j)=>`<th>${j?'R'+j:'梯形 T'}</th>`).join('')}</tr></thead><tbody>${rows.map((row,i)=>`<tr><td>${2**(i+1)}</td>${Array.from({length:s.npow},(_,j)=>`<td>${j<row.length?fmt(row[j],11):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
  $('plot1-caption').textContent=s.method==='romberg'?'圖上顯示最細一列的梯形；目前數值結果來自外推表右下角。':s.method==='gauss3'?`每小段 3 個內部節點，共 ${3*n} 次取樣；權重與區間半寬都已計入。`:'陰影表現有號積分區域，x 軸下方對積分給負貢獻。';
  $('plot2-caption').textContent='同一函數、同一積分區間，只改 n。理論精確的多項式或對稱抵消，可能很早就接近浮點下限。';
  $('insight').textContent=s.method==='romberg'?`目前最細分段 n=${n}，共 ${s.npow} 列外推。向右逐欄消去 h²、h⁴、h⁶ 等主誤差；請看表格索引與倍率一起變化。`:reference===0?'這個區間的解析積分為零，可能來自奇偶對稱的正負抵消。因此只顯示絕對誤差，不把相對誤差設成零。':`目前分段 n=${n}，步長 h=${fmt(h,6)}。切換不同方法時，圖形、取樣方式與誤差曲線會一起改變；不能只用節點個數推斷準確度。`;
 }
 function drawDouble(){
  const s=states.double,key=[s.sid,s.k,s.region,s.n].join('|');
  if(!surfaceCache||surfaceCache.key!==key){const f=M.surface(s.sid,s.k),reference=M.surfaceReference(s.sid,s.k,s.region),result=M.doubleIntegral(f,s.region,s.n),ns=[...new Set([2,4,8,12,16,24,s.n])].sort((a,b)=>a-b),errors=ns.map(n=>[Math.log2(n),logerr(M.doubleIntegral(f,s.region,n)-reference.value)]);surfaceCache={key,f,reference,result,ns,errors,region:s.region,n:s.n};}
  const model=surfaceCache,hi=x=>M.upper(s.region,x),areaPoints=[[0,0],[1,0],[1,hi(1)],...Array.from({length:101},(_,i)=>{const x=1-i/100;return[x,hi(x)];})];
  drawSurface();P.svg($('plot1'),{x:[0,1.06],y:[0,1.1],xt:[0,.25,.5,.75,1],yt:[0,.25,.5,.75,1],label:'雙重積分區域與目前固定外層 x 的切片',curves:[{fn:hi,a:0,b:1}],fills:[{points:areaPoints,color:'teal'}],segments:[{x1:s.slice,y1:0,x2:s.slice,y2:hi(s.slice),color:'orange',width:4}],ylabel:'y'});
  $('plot1-caption').textContent=`目前 x=${fmt(s.slice,3)}，內層 y 從 0 到 ${fmt(hi(s.slice),5)}；使用中點分段時，內層 Δy 由目前外層中點重新計算。`;
  P.svg($('plot2'),{x:[1,Math.log2(24)],y:P.range(model.errors.map(p=>p[1]),false),xt:[1,2,3,4,Math.log2(24)],label:'雙重中點積分同步加密兩層分段後的誤差或參考差',curves:[{points:model.errors,color:'teal'}],points:[{x:Math.log2(s.n),y:logerr(model.result-model.reference.value),label:`n=${s.n}`}],xlabel:'log₂(n)',ylabel:model.reference.exact?'log₁₀ |誤差|':'log₁₀ |參考差|'});
  $('plot2-caption').textContent=model.reference.exact?'目前使用解析參考值，圖中誤差來自中點小體積加總。某些低次模型在特定區域可能恰好精確。':'曲邊波面以高密度四點 Gauss 作參考。這是兩種方法的數值差，不是嚴格真誤差界。';
  metrics([['雙重中點積分',model.result],['參考值',model.reference.value,model.reference.exact?'解析參考':'高密度四點 Gauss 參考'],[model.reference.exact?'絕對誤差':'高密度參考差',Math.abs(model.result-model.reference.value)],['長方柱個數',s.n*s.n,`外層 ${s.n} × 內層 ${s.n}`]]);
  const regions={rectangle:'正方形',triangle:'三角形',parabola:'拋物線邊界'};$('insight').textContent=`目前在${regions[s.region]}上加總 ${s.n*s.n} 根中點長方柱。改變 n 會改變近似；拖曳旋轉或調整視角只改觀看方向，積分值維持 ${fmt(model.result,9)}。橙色切片同時標在曲面與底部區域。`;
 }
 function drawSurface(){if(active!=='double'||!surfaceCache||!$('surface'))return;P.surface($('surface'),surfaceCache,states.double);}
 function bindOrbit(){const canvas=$('surface');canvas.setAttribute('role','img');let start=null;
  canvas.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,yaw:states.double.yaw,pitch:states.double.pitch};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!start)return;states.double.yaw=((start.yaw+(e.clientX-start.x)*.5+540)%360)-180;states.double.pitch=Math.max(15,Math.min(75,start.pitch-(e.clientY-start.y)*.35));for(const key of ['yaw','pitch'])$('controls').querySelector(`[data-key="${key}"]`).value=states.double[key];updateOutputs();cancelAnimationFrame(frame);frame=requestAnimationFrame(drawSurface);});
  canvas.addEventListener('pointerup',()=>start=null);canvas.addEventListener('pointercancel',()=>start=null);
 }
 function drawImproper(){
  const s=states.improper,n=2**s.npow,singular=s.iid==='singular',eps=10**s.epspow,alpha=s.alpha;
  if(singular&&alpha>=1){
   const f=x=>x**(-alpha),partial=alpha===1?-Math.log(eps):(1-eps**(1-alpha))/(1-alpha),direct=M.integrate(f,eps,1,n,'gauss4');
   P.svg($('plot1'),{x:[0,1],y:[0,8],label:'不可積端點奇異函數，尖峰超出圖框',curves:[{fn:f,a:.00001}],segments:[{x1:eps,y1:0,x2:eps,y2:8,color:'orange',dash:true}]});
   $('plot2').innerHTML='<div class="insight-panel"><h3>原瑕積分發散</h3><p>α≥1 時，不能使用 α&lt;1 的 [0,1] 平滑化公式。每次截斷都可能得到有限數，但端點極限沒有有限答案。</p></div>';
   P.svg($('plot3'),{x:[-8,-1],y:P.range(P.sample(p=>alpha===1?-p*Math.log(10):(1-10**(p*(1-alpha)))/(1-alpha),-8,-1).map(v=>v[1])),label:'把截斷端點越推近零，有限截後積分持續增長',curves:[{fn:p=>alpha===1?-p*Math.log(10):(1-10**(p*(1-alpha)))/(1-alpha),color:'orange'}],xlabel:'log₁₀(ε)',ylabel:'截後積分'});
   metrics([['原積分','發散'],['截後有限積分',direct],['截後解析值',partial],['截去長度 ε',eps]]);$('improper-error-title').textContent='截後數字有限，端點極限仍發散';$('plot3-caption').textContent='這裡畫的是截後積分值，不是對有限真值的誤差。';$('insight').textContent=`目前 α=${fmt(alpha,2)}≥1。把 ε 縮小，積分會持續增加；增加分段數只能改善截後區間的計算，不能讓發散的瑕積分變成收斂。`;$('plot2-caption').textContent='平滑化推導的適用條件不成立。';return;
  }
  const model=M.improper(s.iid,alpha),value=M.integrate(model.g,0,1,n,'gauss4'),cut=s.B;
  const originalRange=singular?[0,1]:[0,cut],yr=singular?[0,8]:P.range(P.sample(model.f,0,cut).map(v=>v[1]));
  P.svg($('plot1'),{x:originalRange,y:yr,label:singular?'可積端點奇異函數與截去端點位置':'原無窮積分的有限顯示與直接截斷區間',curves:[{fn:model.f,a:singular?.00001:0}],segments:singular?[{x1:eps,y1:0,x2:eps,y2:8,color:'orange',dash:true}]:[]});
  P.svg($('plot2'),{x:[0,1],y:P.range(P.sample(model.g,0,1).map(v=>v[1])),label:'代換並延拓端點後的新被積函數',curves:[{fn:model.g,color:'teal'}],xlabel:model.xlabel,ylabel:'g('+model.xlabel+')'});
  let tail,discrete,errPoints,errCurves;
  if(singular){
   const partial=e=>(1-e**(1-alpha))/(1-alpha);tail=eps**(1-alpha)/(1-alpha);discrete=Math.abs(M.integrate(model.f,eps,1,n,'gauss4')-partial(eps));
   errCurves=[{fn:p=>logerr(10**(p*(1-alpha))/(1-alpha)),color:'orange'},{fn:p=>logerr(M.integrate(model.f,10**p,1,n,'gauss4')-partial(10**p)),color:'blue'}];
   P.svg($('plot3'),{x:[-8,-1],y:[-16,2],xt:[-8,-6,-4,-2,-1],yt:[-16,-12,-8,-4,0],label:'端點截去面積與截後離散誤差，隨 ε 改變',curves:errCurves,segments:[{x1:s.epspow,y1:-16,x2:s.epspow,y2:2,color:'muted',dash:true}],xlabel:'log₁₀(ε)',ylabel:'log₁₀ 誤差'});
  }else{
   const partial=b=>s.iid==='tail'?Math.atan(b*b)/2:Math.atan(b);tail=model.exact-partial(cut);discrete=Math.abs(M.integrate(model.f,0,cut,n,'gauss4')-partial(cut));
   errCurves=[{fn:b=>logerr(model.exact-partial(b)),color:'orange'},{fn:b=>logerr(M.integrate(model.f,0,b,n,'gauss4')-partial(b)),color:'blue'}];
   P.svg($('plot3'),{x:[1,30],y:[-16,1],xt:[1,10,20,30],yt:[-16,-12,-8,-4,0],label:'尾端截斷誤差與有限區間離散誤差，隨 B 改變',curves:errCurves,segments:[{x1:cut,y1:-16,x2:cut,y2:1,color:'muted',dash:true}],xlabel:'截斷上限 B',ylabel:'log₁₀ 誤差'});
  }
  $('improper-error-title').textContent='把截斷與離散誤差分開';metrics([['代換後積分',value],['與解析值的差',Math.abs(value-model.exact)],['截斷漏掉面積',tail],['截後離散誤差',discrete,`四點 Gauss，n=${n}`]]);
  $('plot1-caption').textContent=singular?`原尖峰只在繪圖上裁切。直接截去 [0,ε] 的 ε=${eps.toExponential(2)}，會漏掉一段可計算的面積。`:`左圖只畫 0 到 B=${fmt(cut,2)}。原積分仍到無窮遠；代換後結果不是把上限改成 B 的答案。`;
  $('plot2-caption').textContent=model.transform+'；'+model.formula+'。'+model.condition;
  $('plot3-caption').textContent=singular?'固定 n，單獨改變 ε。橙線是刪掉的面積；藍線只比較截後區間的數值與解析積分。':'固定 n，增加 B 會減少尾端面積，也會加大直接積分的步長。兩種誤差可能朝不同方向變化。';
  $('insight').textContent=`代換後以 ${n} 小區間做四點 Gauss，結果 ${fmt(value,10)}，解析值為 ${fmt(model.exact,10)}。${singular?`目前 α=${fmt(alpha,2)}；接近 1 時，即使刪去很短的端點區間，也可能漏掉很大的面積。`:'注意左側截斷策略與右側變數代換策略是兩條不同計算路徑，不能混用誤差來源。'}`;
 }

 $('print').addEventListener('click',()=>window.print());window.addEventListener('hashchange',()=>select(location.hash.slice(1),false));let resize;window.addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(draw,100);});select(location.hash.slice(1)||'taylor',false);
